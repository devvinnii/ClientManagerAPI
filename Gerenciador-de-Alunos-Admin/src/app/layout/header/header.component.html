<header class="sticky top-0 z-30 flex min-h-[4.5rem] items-center justify-between border-b border-slate-200/90 bg-white/95 px-4 backdrop-blur-xl sm:px-6 lg:px-8">
  <div class="flex items-center gap-3">
    <button
      type="button"
      (click)="menuToggle.emit()"
      class="grid size-11 place-items-center rounded-xl text-slate-600 transition hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600 lg:hidden"
      aria-label="Abrir menu"
    >
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div class="lg:hidden">
      <app-brand-mark [compact]="true" />
    </div>
    <div class="hidden lg:block">
      <p class="text-[0.68rem] font-bold uppercase tracking-[0.17em] text-slate-400">Painel administrativo</p>
      <p class="mt-0.5 text-sm font-bold text-slate-800">{{ currentSection() }}</p>
    </div>
  </div>

  <div class="flex items-center gap-2 sm:gap-3">
    <div class="hidden text-right sm:block">
      <p class="max-w-48 truncate text-sm font-bold text-slate-900">{{ user()?.username }}</p>
      <p class="mt-0.5 text-xs font-semibold text-sky-700">{{ roleLabel() }}</p>
    </div>
    <div class="grid size-10 place-items-center rounded-full border-2 border-white bg-sky-100 font-extrabold uppercase text-sky-800 shadow-sm ring-1 ring-sky-200" aria-hidden="true">
      {{ user()?.username?.charAt(0) || '?' }}
    </div>
    <button
      type="button"
      (click)="logout()"
      class="ui-button ui-button-secondary min-h-10 px-3 hover:border-red-200 hover:bg-red-50 hover:text-red-700"
    >
      Sair
    </button>
  </div>
</header>
