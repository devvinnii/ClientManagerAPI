<header class="flex min-h-20 items-center justify-between border-b border-slate-200 bg-white px-4 sm:px-6 lg:px-8">
  <div class="flex items-center gap-3">
    <button
      type="button"
      (click)="menuToggle.emit()"
      class="grid size-11 place-items-center rounded-xl text-slate-600 transition hover:bg-slate-100 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600 lg:hidden"
      aria-label="Abrir menu"
    >
      <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div class="lg:hidden">
      <app-brand-mark [compact]="true" />
    </div>
    <div class="hidden lg:block">
      <p class="text-xs font-semibold uppercase tracking-[0.16em] text-slate-400">Painel administrativo</p>
      <p class="hidden text-sm font-semibold text-slate-700 sm:block">Gestão segura e simples para a equipe</p>
    </div>
  </div>

  <div class="flex items-center gap-3">
    <div class="hidden text-right sm:block">
      <p class="max-w-48 truncate text-sm font-bold text-slate-800">{{ user()?.username }}</p>
      <p class="text-xs font-medium text-sky-700">{{ roleLabel() }}</p>
    </div>
    <div class="grid size-10 place-items-center rounded-full bg-sky-100 font-bold uppercase text-sky-800" aria-hidden="true">
      {{ user()?.username?.charAt(0) || '?' }}
    </div>
    <button
      type="button"
      (click)="logout()"
      class="min-h-10 rounded-xl border border-slate-200 px-3 text-sm font-semibold text-slate-600 transition hover:border-red-200 hover:bg-red-50 hover:text-red-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-600"
    >
      Sair
    </button>
  </div>
</header>
