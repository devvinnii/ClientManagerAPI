<aside class="flex h-full w-72 flex-col border-r border-white/5 bg-[#0b2945] px-4 py-5 text-slate-100 shadow-[8px_0_32px_rgba(2,12,27,0.08)]">
  <div class="flex items-center justify-between gap-3 px-2 pb-8 pt-1">
    <app-brand-mark tone="light" />
    <button
      type="button"
      class="grid size-10 shrink-0 place-items-center rounded-xl text-2xl text-slate-300 hover:bg-white/10 hover:text-white lg:hidden"
      aria-label="Fechar menu"
      (click)="navigate.emit()"
    >
      ×
    </button>
  </div>

  <nav aria-label="Navegação principal" class="flex-1">
    <p class="px-3 pb-3 text-[0.68rem] font-bold uppercase tracking-[0.19em] text-slate-400">
      Menu principal
    </p>
    <ul class="space-y-1.5">
      @for (item of visibleItems(); track item.route) {
        <li>
          <a
            [routerLink]="item.route"
            routerLinkActive="bg-white/12 text-white shadow-[inset_3px_0_0_#2dd4bf]"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="navigate.emit()"
            class="group flex min-h-12 items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-300 transition hover:bg-white/8 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-300"
          >
            <span class="grid size-8 place-items-center rounded-lg bg-white/5 text-cyan-300 group-hover:bg-white/10 group-hover:text-cyan-200">
              <app-nav-icon [name]="item.icon" />
            </span>
            <span class="flex-1">{{ item.label }}</span>
            <span class="text-base text-white/0 transition group-hover:text-white/40" aria-hidden="true">›</span>
          </a>
        </li>
      }
    </ul>
  </nav>

  <div class="mt-5 rounded-2xl border border-white/10 bg-white/[0.055] p-4">
    <div class="mb-3 h-1 w-9 rounded-full bg-cyan-400"></div>
    <p class="text-xs font-bold uppercase tracking-wider text-cyan-300">Área interna</p>
    <p class="mt-2 text-xs leading-relaxed text-slate-400">
      Ambiente exclusivo para a equipe da Talentos do Capão.
    </p>
  </div>
</aside>
