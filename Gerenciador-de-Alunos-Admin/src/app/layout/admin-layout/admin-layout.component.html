<div class="min-h-dvh bg-slate-50 text-slate-900">
  <div class="fixed inset-y-0 left-0 z-40 hidden lg:block">
    <app-sidebar />
  </div>

  @if (mobileMenuOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-slate-950/55 backdrop-blur-[2px] lg:hidden"
      aria-label="Fechar menu"
      (click)="mobileMenuOpen.set(false)"
    ></button>
    <div class="fixed inset-y-0 left-0 z-50 lg:hidden">
      <app-sidebar (navigate)="mobileMenuOpen.set(false)" />
    </div>
  }

  <div class="lg:pl-72">
    <app-header (menuToggle)="mobileMenuOpen.set(true)" />
    <main class="mx-auto w-full max-w-[100rem] p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
