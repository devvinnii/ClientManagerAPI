<div class="fixed inset-0 z-[60] flex items-end justify-center sm:items-center sm:p-4" role="presentation">
  <button
    type="button"
    class="absolute inset-0 bg-slate-950/60 backdrop-blur-[2px]"
    aria-label="Fechar detalhes"
    (click)="closed.emit()"
  ></button>

  <section
    class="relative w-full rounded-t-3xl bg-white p-6 shadow-2xl sm:max-w-lg sm:rounded-3xl sm:p-8"
    role="dialog"
    aria-modal="true"
    aria-labelledby="student-details-title"
  >
    <button
      type="button"
      (click)="closed.emit()"
      class="absolute right-4 top-4 grid size-10 place-items-center rounded-xl text-2xl text-slate-500 hover:bg-slate-100"
      aria-label="Fechar"
    >
      ×
    </button>

    <div class="flex items-center gap-4 pr-10">
      <app-student-avatar [student]="student" size="lg" />
      <div class="min-w-0">
        <span
          class="inline-flex rounded-full px-2.5 py-1 text-xs font-bold"
          [class.bg-emerald-100]="student.active"
          [class.text-emerald-800]="student.active"
          [class.bg-slate-200]="!student.active"
          [class.text-slate-700]="!student.active"
        >
          {{ student.active ? 'Ativo' : 'Inativo' }}
        </span>
        <h2 id="student-details-title" class="mt-2 truncate text-2xl font-black text-slate-900">{{ student.name }}</h2>
        <p class="mt-1 text-sm text-slate-500">Aluno #{{ student.id }}</p>
      </div>
    </div>

    <dl class="mt-7 divide-y divide-slate-100 rounded-2xl border border-slate-200 px-4">
      <div class="py-3">
        <dt class="text-xs font-bold uppercase tracking-wider text-slate-400">CPF</dt>
        <dd class="mt-1 font-semibold text-slate-800">{{ student.cpf | cpf }}</dd>
      </div>
      <div class="py-3">
        <dt class="text-xs font-bold uppercase tracking-wider text-slate-400">E-mail</dt>
        <dd class="mt-1 break-all font-semibold text-slate-800">{{ student.email || 'Não informado' }}</dd>
      </div>
      <div class="py-3">
        <dt class="text-xs font-bold uppercase tracking-wider text-slate-400">Telefone</dt>
        <dd class="mt-1 font-semibold text-slate-800">{{ student.phone | phone }}</dd>
      </div>
    </dl>

    <div class="mt-7 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
      <button type="button" (click)="closed.emit()" class="min-h-11 rounded-xl border border-slate-300 px-5 font-bold text-slate-700 hover:bg-slate-50">
        Fechar
      </button>
      <button type="button" (click)="edit.emit(student)" class="min-h-11 rounded-xl bg-sky-700 px-5 font-bold text-white hover:bg-sky-800">
        Editar aluno
      </button>
    </div>
  </section>
</div>
