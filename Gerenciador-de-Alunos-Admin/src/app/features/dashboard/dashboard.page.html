<section aria-labelledby="dashboard-title">
  <div class="rounded-3xl bg-gradient-to-br from-[#0d2742] to-sky-800 p-6 text-white shadow-xl shadow-slate-900/10 sm:p-8">
    <p class="text-sm font-bold uppercase tracking-[0.18em] text-teal-300">Visão geral</p>
    <h1 id="dashboard-title" class="mt-3 text-3xl font-black tracking-tight sm:text-4xl">Dashboard</h1>
    <p class="mt-3 max-w-2xl text-sm leading-relaxed text-slate-300 sm:text-base">
      Esta é a base do painel administrativo. Indicadores e resumos operacionais serão adicionados em uma etapa futura.
    </p>
  </div>

  <div class="mt-6 grid gap-4 sm:grid-cols-2 xl:grid-cols-3">
    @for (item of ['Alunos', 'Turmas', 'Atividades']; track item) {
      <article class="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
        <div class="h-3 w-24 rounded-full bg-slate-100"></div>
        <div class="mt-5 h-9 w-16 rounded-lg bg-slate-100"></div>
        <p class="mt-4 text-sm font-semibold text-slate-400">{{ item }} — conteúdo em breve</p>
      </article>
    }
  </div>
</section>
