# ===============================
# CONFIGURACAO DO BANCO DE DADOS
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/studentdb
spring.datasource.username=vini
spring.datasource.password=vini123

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Schema existente anterior ao Flyway

# ===============================
# UPLOAD DE ARQUIVOS
# ===============================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Diretorio local para salvar uploads
file.upload-dir=uploads

# Seguranca: JWT_SECRET deve possuir ao menos 32 caracteres e ser definido no ambiente.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.security.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
