<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerenciador de Alunos</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(10,20,40,0.8), rgba(10,20,40,0.9)),
                        url("https://images.unsplash.com/photo-1521412644187-c49fa049e84d");
            background-size: cover;
        }
    </style>
</head>

<body class="text-white text-lg">

<div class="max-w-5xl mx-auto mt-16 px-6">

    <h1 class="text-4xl font-semibold mb-8">Gerenciador de Alunos</h1>

    <!-- CADASTRO -->
    <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl mb-10 shadow-lg space-y-4">
        <h2 class="text-2xl font-semibold mb-2">Cadastrar</h2>

        <input class="w-full p-4 rounded-lg text-black" type="text" id="name" placeholder="Nome">
        <input class="w-full p-4 rounded-lg text-black" type="text" id="email" placeholder="Email">
        <input class="w-full p-4 rounded-lg text-black" type="text" id="cpf" placeholder="CPF">
        <input class="w-full p-4 rounded-lg text-black" type="text" id="phone" placeholder="Telefone">
        <input class="w-full p-2 rounded-lg bg-white text-black" type="file" id="photo">

        <button onclick="createClient()"
                class="bg-blue-500 hover:bg-blue-600 transition px-6 py-3 rounded-lg font-medium shadow-md hover:scale-105">
            Salvar
        </button>
    </div>

    <!-- BUSCA -->
    <div class="bg-white/10 backdrop-blur-md p-8 rounded-2xl shadow-lg space-y-6">

        <h2 class="text-2xl font-semibold">Buscar aluno</h2>

        <input class="w-full p-4 rounded-lg text-black"
               type="text"
               id="search"
               placeholder="Digite CPF ou Nome">

        <button onclick="search()"
                class="bg-blue-500 hover:bg-blue-600 px-5 py-3 rounded-lg w-full">
            Buscar
        </button>

    </div>

</div>

<!-- POPUP -->
<div id="popup"
     class="fixed top-5 right-5 px-5 py-3 rounded-lg text-white opacity-0 -translate-y-5 transition-all duration-300">
</div>

<script>
    const API = "http://localhost:8080/api/clients";

    function showPopup(msg, success = true) {
        const popup = document.getElementById("popup");
        popup.innerText = msg;

        popup.className =
            "fixed top-5 right-5 px-5 py-3 rounded-lg text-white transition-all duration-300 " +
            (success ? "bg-green-500" : "bg-red-500");

        popup.classList.remove("opacity-0", "-translate-y-5");
        popup.classList.add("opacity-100", "translate-y-0");

        setTimeout(() => {
            popup.classList.add("opacity-0", "-translate-y-5");
        }, 3000);
    }

    function createClient() {
        const formData = new FormData();

        formData.append("name", document.getElementById("name").value);
        formData.append("email", document.getElementById("email").value);
        formData.append("cpf", document.getElementById("cpf").value);
        formData.append("phone", document.getElementById("phone").value);

        const photo = document.getElementById("photo").files[0];
        if (photo) formData.append("photo", photo);

        fetch(API, {
            method: "POST",
            body: formData
        })
        .then(res => {
            if (!res.ok) throw new Error();
            return res.json();
        })
        .then(() => {
            showPopup("Aluno cadastrado com sucesso!");
        })
        .catch(() => showPopup("Erro ao cadastrar", false));
    }

    function search() {
        const value = document.getElementById("search").value;

        if (!value) {
            showPopup("Digite CPF ou nome", false);
            return;
        }

        window.location.href = `details.html?query=${encodeURIComponent(value)}`;
    }
</script>

</body>
</html>
