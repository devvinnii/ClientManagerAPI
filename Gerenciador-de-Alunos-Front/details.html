<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Aluno</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">

<div class="bg-white/10 backdrop-blur-md p-10 rounded-2xl w-full max-w-2xl space-y-6">

    <h1 class="text-3xl font-semibold">Aluno</h1>

    <div id="content"></div>

    <button onclick="goBack()"
            class="bg-gray-500 hover:bg-gray-600 px-5 py-2 rounded-lg">
        Voltar
    </button>

</div>

<div id="confirmModal"
     class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">

    <div class="bg-white text-black p-6 rounded-xl shadow-lg w-96">
        <h2 class="text-xl font-bold mb-4">Confirmar exclusão</h2>

        <p id="confirmText" class="mb-6"></p>

        <div class="flex justify-end gap-3">
            <button onclick="closeModal()"
                class="px-4 py-2 bg-gray-500 text-white rounded">
                Não
            </button>

            <button onclick="confirmDelete()"
                class="px-4 py-2 bg-red-600 text-white rounded">
                Sim
            </button>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8080/api/clients";

    let selectedClientId = null;
    let selectedClientName = null;

    function getQuery() {
        const params = new URLSearchParams(window.location.search);
        return params.get("query");
    }

    function loadClient() {
        const query = getQuery();

        if (!query) return;

        fetch(`${API}/cpf/${encodeURIComponent(query)}`)
            .then(res => {
                if (!res.ok) throw new Error();
                return res.json();
            })
            .then(client => render(client))
            .catch(() => {
                fetch(`${API}/name/${encodeURIComponent(query)}`)
                    .then(res => {
                        if (!res.ok) throw new Error();
                        return res.json();
                    })
                    .then(renderSearchResults)
                    .catch(() => {
                        document.getElementById("content").innerHTML =
                            "<p>Aluno não encontrado</p>";
                    });
            });
    }

    function renderSearchResults(clients) {
        if (clients.length === 0) {
            document.getElementById("content").innerHTML = "<p>Aluno não encontrado</p>";
            return;
        }

        if (clients.length === 1) {
            render(clients[0]);
            return;
        }

        window.searchResults = clients;
        document.getElementById("content").innerHTML = `
            <p class="mb-4">Foram encontrados ${clients.length} alunos. Selecione um:</p>
            <div class="space-y-3">
                ${clients.map(client => `
                    <button type="button" class="w-full text-left bg-white/10 hover:bg-white/20 p-4 rounded-lg transition"
                            onclick="renderSearchResult(${client.id})">
                        <span class="block font-semibold">${client.name}</span>
                        <span class="text-sm text-slate-300">CPF: ${client.cpf}</span>
                    </button>
                `).join("")}
            </div>
        `;
    }

    function renderSearchResult(id) {
        const client = window.searchResults.find(result => result.id === id);
        if (client) render(client);
    }

    function render(client) {
        const photo = client.photoUrl
            ? `http://localhost:8080/uploads/${client.photoUrl}`
            : "https://via.placeholder.com/100";

        document.getElementById("content").innerHTML = `
            <div class="flex gap-6 items-center">

                <img src="${photo}" class="w-24 h-24 rounded-full border-2 border-blue-500">

                <div>
                    <h2 class="text-2xl font-semibold">${client.name}</h2>
                    <p><b>CPF:</b> ${client.cpf}</p>
                    <p><b>Email:</b> ${client.email}</p>
                    <p><b>Telefone:</b> ${client.phone}</p>
                </div>

            </div>

            <button onclick="openDeleteModal(${client.id}, '${client.name}')"
                class="mt-6 bg-red-500 hover:bg-red-600 px-4 py-2 rounded-lg">
                Excluir
            </button>
        `;
    }

    function openDeleteModal(id, name) {
        selectedClientId = id;
        selectedClientName = name;

        document.getElementById("confirmText").innerText =
            `Deseja realmente excluir o aluno "${name}"?`;

        document.getElementById("confirmModal").classList.remove("hidden");
    }

    function closeModal() {
        document.getElementById("confirmModal").classList.add("hidden");
    }

    function confirmDelete() {
        fetch(`${API}/${selectedClientId}`, {
            method: "DELETE"
        })
        .then(response => {
            if (!response.ok) {
                throw new Error();
            }

            document.getElementById("confirmText").innerHTML =
                `<span class="text-green-600 font-semibold">
                    Aluno excluído com sucesso!
                </span>`;

            setTimeout(() => {
                window.location.href = "index.html";
            }, 1500);
        })
        .catch(() => {
            document.getElementById("confirmText").innerHTML =
                `<span class="text-red-600 font-semibold">
                    Erro ao excluir aluno.
                </span>`;
        });
    }

    function goBack() {
        window.location.href = "index.html";
    }

    loadClient();
</script>

</body>
</html>
